# Config de PRODUCCION (la VM real, no una maquina de desarrollo): dominio
# propio + HTTPS con Let's Encrypt. Se selecciona con
# `docker-compose.prod.yml` (ARG NGINX_CONF=nginx.prod.conf del Dockerfile),
# nunca es el default de `docker-compose.yml` — ese usa `nginx.conf` (HTTP
# plano, sin certificados) para que levantar todo en una laptop de
# desarrollo no dependa de un dominio ni de certificados que ahi no existen.
#
# server_name real (mirroria.duckdns.org) porque ya hay certificado Let's
# Encrypt para ese dominio — HTTP redirige entero a HTTPS. Los certificados
# los genera/renueva certbot en el HOST de la VM (no en este contenedor) y
# llegan acá por el volumen /etc/letsencrypt montado read-only (ver
# docker-compose.prod.yml) — mismo patrón que case-frontend.
server {
    listen 80;
    server_name mirroria.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mirroria.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/mirroria.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirroria.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Compresion: los .js/.css del bundle de Vite bajan ~70% por la red.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    # (text/html va siempre comprimido cuando gzip esta on; listarlo da warning)

    # Bundle de Vite: los nombres llevan hash de contenido, asi que se pueden
    # cachear un año sin riesgo (un deploy nuevo cambia el nombre). `^~` para
    # que gane sobre la location regex de estaticos de abajo.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # index.html SIEMPRE revalidado: si el navegador lo cachea (heurística por
        # Last-Modified), tras un despliegue pide chunks lazy con hash viejo -> 404
        # y la página queda en blanco (auditoría 1b). Los /assets/ siguen inmutables.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Un archivo estatico que falta tiene que contestar 404, no index.html.
    # El comodin de arriba es para las RUTAS de la SPA (/probador, /tienda),
    # pero aplicado a un .png hacia que un archivo ausente llegara al <img>
    # como HTML con 200: el navegador no lo puede decodificar. Costo
    # encontrarlo.
    location ~* \.(png|jpe?g|gif|webp|svg|ico|css|js|mjs|map|woff2?|ttf|glb|wasm|json|txt)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # El prefijo /api/ se preserva completo hacia el backend (proxy_pass
    # termina en /api/ igual que la location) — así llega como
    # /api/v1/... tal como main.ts lo espera (prefijo global 'api/v1').
    location /api/ {
        proxy_pass http://mirroria-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
