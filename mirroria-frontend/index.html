<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MirrorIA</title>
    <meta name="theme-color" content="#281B89" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <script>
      (function() {
        try {
          var p = new URLSearchParams(window.location.search);
          var tok = p.get('__qa_token');
          var usr = p.get('__qa_user');
          if (tok && usr) {
            localStorage.setItem('mirroria_token', tok);
            localStorage.setItem('mirroria_user', decodeURIComponent(usr));
          }
        } catch (_) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
