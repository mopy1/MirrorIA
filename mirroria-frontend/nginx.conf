# Sin dominio/SSL todavía — solo IP. `server_name _` acepta cualquier Host,
# y proxy_pass usa el nombre del servicio de docker-compose (mirroria-backend),
# no localhost, porque nginx corre en su propio contenedor.
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # El prefijo /api/ se preserva completo hacia el backend (proxy_pass
    # termina en /api/ igual que la location) — así llega como
    # /api/v1/... tal como main.ts lo espera (prefijo global 'api/v1').
    location /api/ {
        proxy_pass http://mirroria-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
