# server_name real (mirroria.duckdns.org) porque ya hay certificado Let's
# Encrypt para ese dominio — HTTP redirige entero a HTTPS. Los certificados
# los genera/renueva certbot en el HOST de la VM (no en este contenedor) y
# llegan acá por el volumen /etc/letsencrypt montado read-only (ver
# docker-compose.yml) — mismo patrón que case-frontend.
server {
    listen 80;
    server_name mirroria.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mirroria.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/mirroria.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirroria.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Un archivo estatico que falta tiene que contestar 404, no index.html.
    # El comodin de arriba es para las RUTAS de la SPA (/probador, /tienda),
    # pero aplicado a un .png hacia que un recorte ausente llegara al <img>
    # como HTML con 200: el navegador no lo puede decodificar y el probador
    # decia «esa prenda no se pudo cargar», culpando a la prenda en vez de
    # mostrar que el archivo no estaba desplegado. Costo encontrarlo.
    location ~* \.(png|jpe?g|gif|webp|svg|ico|css|js|mjs|map|woff2?|ttf|glb|wasm|json|txt)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Los recortes del probador los sirve este frontend (public/prendas/).
    # Si esta location da 404, la rama del probador NO esta desplegada.
    # `^~` y no un prefijo pelado: sin eso gana la location con expresion
    # regular de arriba (asi las ordena nginx, no por aparecer antes) y este
    # bloque no se aplicaria nunca a un .png.
    location ^~ /prendas/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # El prefijo /api/ se preserva completo hacia el backend (proxy_pass
    # termina en /api/ igual que la location) — así llega como
    # /api/v1/... tal como main.ts lo espera (prefijo global 'api/v1').
    location /api/ {
        proxy_pass http://mirroria-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
