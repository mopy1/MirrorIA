# Config de DESARROLLO LOCAL: sin dominio ni SSL, solo HTTP en el puerto 80
# del contenedor. `server_name _` acepta cualquier Host, y `proxy_pass` usa
# el nombre del servicio de docker-compose (mirroria-backend), no localhost,
# porque nginx corre en su propio contenedor.
#
# Para el despliegue real (VM con dominio + Let's Encrypt) se usa
# `nginx.prod.conf` en su lugar — ver `../docker-compose.prod.yml` y el
# `ARG NGINX_CONF` del Dockerfile. Este archivo (`nginx.conf`, sin sufijo) es
# el default que usa `../docker-compose.yml` para levantar todo en la propia
# máquina de desarrollo.
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Un archivo estatico que falta tiene que contestar 404, no index.html.
    # El comodin de arriba es para las RUTAS de la SPA (/probador, /tienda),
    # pero aplicado a un .png hacia que un archivo ausente llegara al <img>
    # como HTML con 200: el navegador no lo puede decodificar y la UI que lo
    # pedia fallaba en silencio, culpando al dato en vez de al despliegue.
    location ~* \.(png|jpe?g|gif|webp|svg|ico|css|js|mjs|map|woff2?|ttf|glb|wasm|json|txt)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Fotos de prenda que sirve ESTE frontend (public/prendas/) — las sigue
    # usando el vestidor AR del movil via `arOverlayImageUrl` (URL absoluta
    # guardada en la base). El probador web (RF13) ya no las usa: pasó a
    # Decart VTON, que pide la foto real del producto directo del backend.
    # `^~` y no un prefijo pelado: sin eso gana la location con expresion
    # regular de arriba (asi las ordena nginx, no por aparecer antes) y este
    # bloque no se aplicaria nunca a un .png.
    location ^~ /prendas/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # El prefijo /api/ se preserva completo hacia el backend (proxy_pass
    # termina en /api/ igual que la location) — así llega como
    # /api/v1/... tal como main.ts lo espera (prefijo global 'api/v1').
    location /api/ {
        proxy_pass http://mirroria-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
