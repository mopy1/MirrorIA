services:
  # 🐘 Base de Datos PostgreSQL
  postgres-db:
    image: postgres:16
    container_name: mirroria_postgres
    restart: always
    environment:
      POSTGRES_USER: mirroria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mirroria_db
    ports:
      - "5435:5432"
    volumes:
      - mirroria_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirroria -d mirroria_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 🪞 Backend NestJS — dockerizado. El Frontend React sigue en local (`npm run dev`)
  # apuntando acá vía localhost:3000 — ver mirroria-backend/AGENTS.md.
  mirroria-backend:
    build: ./mirroria-backend
    container_name: mirroria_backend
    restart: always
    env_file:
      - ./mirroria-backend/.env
    environment:
      # Dentro de la red de compose, el host de Postgres es el nombre del
      # servicio, no localhost, y el puerto es el interno del contenedor
      # (5432), no el mapeado al host (5435) — el resto de las variables
      # (JWT_SECRET, STRIPE_*, IA_*, PAGOS_*) vienen tal cual del .env.
      DB_HOST: postgres-db
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      postgres-db:
        condition: service_healthy

  # ⚛️ Frontend React — build de Vite servido por nginx, que además hace de
  # reverse proxy de /api/ hacia mirroria-backend (mismo origen para el
  # navegador: sin CORS que configurar, sin dominio que atar en build time).
  mirroria-frontend:
    build: ./mirroria-frontend
    container_name: mirroria_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - mirroria-backend

volumes:
  mirroria_pgdata:
